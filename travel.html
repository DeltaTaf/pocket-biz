function nav(){for(const [id,key] of [['marketsLink','markets'],['compareLink','compare'],['entryLink','entry'],['travelLink','travel'],['advisorLink','advisor'],['providersLink','providers']])document.getElementById(id).textContent=T(key);document.getElementById('entryLink').href=`market-entry.html?country=${country.code}`;document.getElementById('travelLink').href=`travel.html?country=${country.code}`;document.getElementById('advisorLink').href=`advisor.html?country=${country.code}`;document.getElementById('footerText').textContent=country.name.en;}
function render(){document.documentElement.lang=lang;document.title=`Pocket Biz · ${L(country.name)} · Travel`;nav();const cities=cfg.cities.map(x=>`<div class="city"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');const acts=cfg.activities.map(x=>`<div class="card"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('');const groups=cfg.transportGroups||[{label:{en:T('official'),ja:T('official'),el:T('official')},links:cfg.transportLinks||[]}];const transportHtml=groups.map(g=>`<div class="transport-group"><h4>${esc(L(g.label))}</h4><div class="transport-links">${g.links.map(x=>`<a class="travel-link" href="${x[1]}" target="_blank" rel="noreferrer">${esc(x[0])} ↗</a>`).join('')}</div></div>`).join('');const photo=cfg.credit&&cfg.photo?`<a class="photo-credit" href="${cfg.photo}" target="_blank" rel="noreferrer">${T('photo')}: ${esc(cfg.credit)}</a>`:'';const bg=cfg.photo?`url("${cfg.photo}")`:`url("japan-travel-bg.jpeg")`;document.getElementById('app').innerHTML=`<section class="hero"><div><div class="kicker">${T('kicker')} · ${esc(L(country.name))}</div><h1>${esc(L(country.name))}</h1><p class="lead">${esc(T('lead'))}</p><div class="actions"><a class="btn gold" href="#stay">${T('accommodation')}</a><a class="btn secondary" href="#transport">${T('transport')}</a><a class="btn secondary" href="country.html?country=${country.code}">${T('business')}</a></div></div><div class="destination" style="background-image:${bg}"><div class="kicker" style="color:#eee">${esc(T('kicker'))}</div><h2>${esc(L(country.name))}</h2><div class="cities">${cfg.cities.slice(0,6).map(x=>x[0]).join(' · ')}</div><div class="actions"><a class="btn gold" href="#cities">${T('cities')}</a></div>${photo}</div></section><section class="section"><h2 class="section-title">${T('trip')}</h2><p class="sub">${T('tripLead')}</p><div class="grid3"><a class="card" href="#flights"><h3>✈️ ${T('flights')}</h3><p>${T('flightsText')}</p></a><a class="card" href="#stay"><h3>🏨 ${T('stay')}</h3><p>${T('stayText')}</p></a><a class="card" href="#transport"><h3>🚆 ${T('transportCard')}</h3><p>${T('transportText')}</p></a><a class="card" href="#activities"><h3>🎫 ${T('activities')}</h3><p>${T('activitiesText')}</p></a><a class="card" href="#budget"><h3>💴 ${T('budget')}</h3><p>${T('budgetText')}</p></a><a class="card" href="#prepare"><h3>🧳 ${T('prepare')}</h3><p>${T('prepareText')}</p></a></div></section><section class="section" id="flights"><h2 class="section-title">✈️ ${T('flights')}</h2><div class="panel"><div class="search-panel"><div class="field"><label>${T('from')}</label><input id="from" class="input" placeholder=""></div><div class="field"><label>${T('to')}</label><input id="to" class="input" value="${esc(country.name.en)}"></div><div class="field"><label>${T('date')}</label><input id="flightDate" class="input" type="date"></div><button class="btn" type="button" onclick="flightSearch()">${T('search')}</button></div><div class="actions"><a id="flightLink" class="btn gold" target="_blank" rel="noreferrer" href="https://www.google.com/travel/flights">${T('flightSearch')}</a></div></div></section><section class="section" id="stay"><h2 class="section-title">🏨 ${T('stay')}</h2><div class="panel"><div class="search-panel"><div class="field"><label>${T('city')}</label><select id="stayCity" class="select">${cfg.cities.map(x=>`<option>${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>${T('checkin')}</label><input id="checkin" class="input" type="date"></div><div class="field"><label>${T('checkout')}</label><input id="checkout" class="input" type="date"></div><button class="btn gold" type="button" onclick="staySearch()">${T('searchStay')}</button></div><div id="stayResult"></div></div></section><section class="section" id="transport"><h2 class="section-title">🚆 ${T('around')}</h2><p class="sub">${esc(cfg.transport)}</p><div class="card transport-card">${transportHtml}</div></section><section class="section" id="cities"><h2 class="section-title">${T('cities')}</h2><div class="city-grid">${cities}</div></section><section class="section" id="activities"><h2 class="section-title">🎫 ${T('things')}</h2><div class="grid3">${acts}</div></section><section class="section" id="budget"><h2 class="section-title">💴 ${T('budget')}</h2><div class="cost-grid"><div class="cost"><b>€ <span id="flightCost">0</span></b><span>${T('flights')}</span></div><div class="cost"><b>€ <span id="stayCost">0</span></b><span>${T('stay')}</span></div><div class="cost"><b>€ <span id="transportCost">0</span></b><span>${T('transportCard')}</span></div><div class="cost"><b>€ <span id="foodCost">0</span></b><span>${T('activities')}</span></div></div><div class="panel" style="margin-top:14px"><div class="search-panel" style="grid-template-columns:repeat(4,1fr)"><div class="field"><label>${T('flights')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('stay')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('transportCard')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('activities')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div></div><div style="margin-top:22px;color:var(--muted)">${T('total')}</div><div style="font-size:48px;font-weight:950;letter-spacing:-.06em" id="total">€0</div></div></section><section class="section" id="prepare"><h2 class="section-title">🧳 ${T('before')}</h2><div class="card checklist"><label class="check"><input type="checkbox"> ${T('entryCheck')}</label><label class="check"><input type="checkbox"> ${T('insurance')}</label><label class="check"><input type="checkbox"> ${T('sim')}</label><label class="check"><input type="checkbox"> ${T('payments')}</label><label class="check"><input type="checkbox"> ${T('airport')}</label><label class="check"><input type="checkbox"> ${T('reservation')}</label></div></section>`;}
function flightSearch(){const to=document.getElementById('to').value.trim()||country.name.en;document.getElementById('flightLink').href='https://www.google.com/travel/flights?q='+encodeURIComponent('Flights to '+to);}
function staySearch(){const city=document.getElementById('stayCity').value;document.getElementById('stayResult').innerHTML=`<div class="result"><div class="result-row"><div><b>${esc(city)}</b><div style="color:var(--muted)">${T('booking')}</div></div><a class="btn gold" target="_blank" rel="noreferrer" href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(city)}">${T('booking')}</a></div></div>`;}
function budget(){const v=[...document.querySelectorAll('.costInput')].map(x=>Number(x.value)||0);['flightCost','stayCost','transportCost','foodCost'].forEach((id,i)=>document.getElementById(id).textContent=v[i].toLocaleString());document.getElementById('total').textContent='€'+v.reduce((a,b)=>a+b,0).toLocaleString();}
document.getElementById('languageSelect').value=lang;document.getElementById('languageSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('pbLang',lang);render()});render();
</script></body></html>
