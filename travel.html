nk" class="btn gold" target="_blank" rel="noreferrer" href="https://www.google.com/travel/flights">${T('flightSearch')}</a></div></div></section><section class="section" id="stay"><h2 class="section-title">🏨 ${T('stay')}</h2><div class="panel"><div class="search-panel"><div class="field"><label>${T('city')}</label><select id="stayCity" class="select">${cfg.cities.map(x=>`<option>${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>${T('checkin')}</label><input id="checkin" class="input" type="date"></div><div class="field"><label>${T('checkout')}</label><input id="checkout" class="input" type="date"></div><button class="btn gold" type="button" onclick="staySearch()">${T('searchStay')}</button></div><div id="stayResult"></div></div></section><section class="section" id="transport"><h2 class="section-title">🚆 ${T('around')}</h2><p class="sub">${esc(L(cfg.transport))}</p><div class="card transport-card">${transportHtml}</div></section><section class="section" id="cities"><h2 class="section-title">${T('cities')}</h2><div class="city-grid">${cities}</div></section><section class="section" id="activities"><h2 class="section-title">🎫 ${T('things')}</h2><div class="grid3">${acts}</div></section><section class="section" id="budget"><h2 class="section-title">💴 ${T('budget')}</h2><div class="cost-grid"><div class="cost"><b>€ <span id="flightCost">0</span></b><span>${T('flights')}</span></div><div class="cost"><b>€ <span id="stayCost">0</span></b><span>${T('stay')}</span></div><div class="cost"><b>€ <span id="transportCost">0</span></b><span>${T('transportCard')}</span></div><div class="cost"><b>€ <span id="foodCost">0</span></b><span>${T('activities')}</span></div></div><div class="panel" style="margin-top:14px"><div class="search-panel" style="grid-template-columns:repeat(4,1fr)"><div class="field"><label>${T('flights')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('stay')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('transportCard')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div><div class="field"><label>${T('activities')} €</label><input class="input costInput" type="number" min="0" value="0" oninput="budget()"></div></div><div style="margin-top:22px;color:var(--muted)">${T('total')}</div><div style="font-size:48px;font-weight:950;letter-spacing:-.06em" id="total">€0</div></div></section><section class="section" id="prepare"><h2 class="section-title">🧳 ${T('before')}</h2><div class="card checklist"><label class="check"><input type="checkbox"> ${T('entryCheck')}</label><label class="check"><input type="checkbox"> ${T('insurance')}</label><label class="check"><input type="checkbox"> ${T('sim')}</label><label class="check"><input type="checkbox"> ${T('payments')}</label><label class="check"><input type="checkbox"> ${T('airport')}</label><label class="check"><input type="checkbox"> ${T('reservation')}</label></div></section>`;}
function flightSearch(){const to=document.getElementById('to').value.trim()||L(country.name);document.getElementById('flightLink').href='https://www.google.com/travel/flights?q='+encodeURIComponent(T('flightQuery')+' '+to);}
function staySearch(){const city=document.getElementById('stayCity').value;document.getElementById('stayResult').innerHTML=`<div class="result"><div class="result-row"><div><b>${esc(city)}</b><div style="color:var(--muted)">${T('booking')}</div></div><a class="btn gold" target="_blank" rel="noreferrer" href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(city)}">${T('booking')}</a></div></div>`;}
function budget(){const v=[...document.querySelectorAll('.costInput')].map(x=>Number(x.value)||0);['flightCost','stayCost','transportCost','foodCost'].forEach((id,i)=>document.getElementById(id).textContent=v[i].toLocaleString());document.getElementById('total').textContent='€'+v.reduce((a,b)=>a+b,0).toLocaleString();}
document.getElementById('languageSelect').value=lang;document.getElementById('languageSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('pbLang',lang);document.getElementById('languageLabel').textContent=lang==='ja'?'言語':lang==='el'?'Γλώσσα':'Language';render()});document.getElementById('languageLabel').textContent=lang==='ja'?'言語':lang==='el'?'Γλώσσα':'Language';render();
</script></body></html>
