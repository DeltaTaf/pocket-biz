<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Biz · Compare markets</title>
<meta name="description" content="Compare two markets side by side on culture difficulty, opportunity and business style.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="container">
<nav class="nav">
  <a class="brand" href="index.html"><span class="brand-mark">PB</span><span>Pocket Biz</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="markets.html">Markets</a>
    <a href="compare.html">Compare</a>
    <a href="market-entry.html">Market Entry</a>
    <a href="advisor.html">Advisor</a>
    <a href="providers.html">Providers</a>
    <select id="languageSelect" class="lang-toggle" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="el">Ελληνικά</option>
    </select>
  </div>
</nav>
<main id="main">
<section class="section">
  <div class="kicker">DECISION TOOL</div>
  <h1 style="font-size:64px">Compare markets</h1>
  <p class="sub">Compare two countries without making the browser scroll through a geological era.</p>
  <div class="toolbar">
    <label class="visually-hidden" for="a">First market</label>
    <select id="a"></select>
    <label class="visually-hidden" for="b">Second market</label>
    <select id="b"></select>
  </div>
  <div id="comparison" class="grid2"></div>
</section>
</main>
<footer class="footer"><span>Pocket Biz</span><span>v23</span></footer>
</div>
<script src="assets/data.js"></script>
<script>
setupGlobal();
const a = document.getElementById("a"), b = document.getElementById("b");

function fill(sel, selectedCode){
  sel.innerHTML = DATA.countries.map(c => `<option value="${c.code}" ${c.code === selectedCode ? "selected" : ""}>${esc(L(c.name))}</option>`).join("");
}

let codeA = DATA.countries[0].code;
let codeB = DATA.countries[1]?.code || DATA.countries[0].code;
fill(a, codeA); fill(b, codeB);

function riskClass(v){ return v >= 7 ? "high" : v >= 4 ? "med" : ""; }

function renderCompare(){
  const x = DATA.countries.find(c => c.code === a.value), y = DATA.countries.find(c => c.code === b.value);
  const card = (c, other) => {
    const diffHot = c.difficulty > other.difficulty ? "color:var(--red)" : "";
    const oppHot = c.opportunity > other.opportunity ? "color:var(--green)" : "";
    return `<div class="card">
      <h2>${pbFlag(c.code,true)}${esc(L(c.name))}</h2>
      <p>${esc(L(c.summary))}</p>
      <div class="tool-row"><span>Culture difficulty</span><b style="${diffHot}">${c.difficulty}/10</b></div>
      <div class="meter risk"><span class="${riskClass(c.difficulty)}" style="width:${c.difficulty*10}%"></span></div>
      <div class="tool-row"><span>Opportunity</span><b style="${oppHot}">${c.opportunity}/10</b></div>
      <div class="meter"><span style="width:${c.opportunity*10}%"></span></div>
      <div class="tool-row"><span>Style</span><b>${esc(L(c.tags)[0] || "—")}</b></div>
      <p><b>Market:</b> ${esc(L(c.market))}</p>
      <a class="btn gold" href="${countryUrl(c.code)}">Open ${esc(L(c.name))}</a>
    </div>`;
  };
  document.getElementById("comparison").innerHTML = card(x, y) + card(y, x);
}

function handleChange(changed, other){
  if (changed.value === other.value){
    // Keep the two picks distinct by advancing the other select to the next country.
    const idx = DATA.countries.findIndex(c => c.code === changed.value);
    const next = DATA.countries[(idx + 1) % DATA.countries.length];
    other.value = next.code;
  }
  renderCompare();
}

a.addEventListener("change", () => handleChange(a, b));
b.addEventListener("change", () => handleChange(b, a));
renderCompare();
document.addEventListener("languagechange", () => { fill(a, a.value); fill(b, b.value); renderCompare(); });
</script>
</body>
</html>
