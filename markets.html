function translateNode(n,lang){
 const pack=PB_I18N[lang]||PB_I18N.en; const x=(n.nodeValue||''); const trim=x.trim(); if(!trim)return;
 let y=pack.exact[trim]||extra[lang]?.[trim]||trim;
 if(y===trim){for(const p of Object.values(PB_I18N)){const k=Object.keys(p.exact).find(k=>p.exact[k]===trim);if(k&&pack.exact[k]){y=pack.exact[k];break;}}}
 if(y===trim){for(const p of Object.values(extra)){const k=Object.keys(p).find(k=>p[k]===trim);if(k&&extra[lang]?.[k]){y=extra[lang][k];break;}}}
 if(y===trim){for(const [a,b] of Object.entries(extra[lang]||{})){if(a.endsWith(' ')&&trim.startsWith(a.trim())){y=b+trim.slice(a.trim().length);break;} if(trim.startsWith(a)){y=b+trim.slice(a.length);break;}}}
 if(lang==='el'){
  y=y.replace(/business travelers/gi,'ταξιδιώτες για επαγγελματικούς λόγους').replace(/meeting norms/gi,'κανόνες συναντήσεων').replace(/meetings/gi,'συναντήσεις').replace(/meeting/gi,'συνάντηση').replace(/setup/gi,'εγκατάσταση').replace(/gaming/gi,'βιντεοπαιχνίδια').replace(/design/gi,'σχεδιασμός').replace(/premium/gi,'υψηλής αξίας').replace(/providers/gi,'παρόχους').replace(/provider/gi,'πάροχο').replace(/review/gi,'αξιολόγηση').replace(/reports/gi,'αναφορές').replace(/blogs/gi,'ιστολόγια').replace(/country profiles/gi,'προφίλ χωρών').replace(/validation/gi,'επικύρωση').replace(/overselling/gi,'υπερβολική πώληση').replace(/business/gi,'επιχειρηματική δραστηριότητα');
 }
 if(y!==x)n.nodeValue=y;
}
function apply(){const lang=localStorage.getItem('pbLang')||'en'; document.documentElement.lang=lang; const pack=PB_I18N[lang]||PB_I18N.en;

}
