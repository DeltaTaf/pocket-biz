<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Biz · Markets</title>
<meta name="description" content="Browse country profiles covering business culture, etiquette, regulations and market opportunity.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="container">
<nav class="nav">
  <a class="brand" href="index.html"><span class="brand-mark">PB</span><span>Pocket Biz</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="markets.html">Markets</a>
    <a href="compare.html">Compare</a>
    <a href="market-entry.html">Market Entry</a>
    <a href="advisor.html">Advisor</a>
    <a href="providers.html">Providers</a>
    <select id="languageSelect" class="lang-toggle" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="el">Ελληνικά</option>
    </select>
  </div>
</nav>
<main id="main">
<section class="section">
  <div class="kicker">EXPLORE</div>
  <h1 style="font-size:64px">Markets</h1>
  <p class="sub">Choose a market to open its dedicated country workspace.</p>
  <div class="toolbar">
    <label class="visually-hidden" for="search">Search countries</label>
    <input id="search" placeholder="Search countries…">
    <label class="visually-hidden" for="region">Filter by region</label>
    <select id="region"><option value="all">All regions</option></select>
  </div>
  <div id="markets" class="market-grid"></div>
</section>
</main>
<footer class="footer"><span>Pocket Biz</span><span>v23</span></footer>
</div>
<script src="assets/data.js"></script>
<script>
setupGlobal();
const regionEl = document.getElementById("region");
function populateRegions(){
  const current = regionEl.value || "all";
  const regions = [...new Set(DATA.countries.map(c => L(c.region)))];
  regionEl.innerHTML = `<option value="all">${U("allRegions") || "All regions"}</option>` +
    regions.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  regionEl.value = regions.includes(current) ? current : "all";
}
function renderMarkets(){
  const q = document.getElementById("search").value.toLowerCase(), r = regionEl.value;
  document.getElementById("markets").innerHTML = DATA.countries
    .filter(c => (!q || L(c.name).toLowerCase().includes(q) || c.code.toLowerCase().includes(q)) && (r === "all" || L(c.region) === r))
    .map(c => `<a class="market-card" href="${countryUrl(c.code)}" data-country-link="${c.code}"><div>${pbFlag(c.code)}</div><div class="name">${esc(L(c.name))}</div><div class="meta">${esc(L(c.region))} · Difficulty ${c.difficulty}/10</div></a>`)
    .join("") || `<div class="empty-state">No markets match your search.</div>`;
  document.querySelectorAll("[data-country-link]").forEach(a => a.addEventListener("click", () => saveCountry(a.dataset.countryLink)));
}
populateRegions();
document.getElementById("search").addEventListener("input", renderMarkets);
regionEl.addEventListener("change", renderMarkets);
renderMarkets();
document.addEventListener("languagechange", () => { populateRegions(); renderMarkets(); });
</script>
</body>
</html>
