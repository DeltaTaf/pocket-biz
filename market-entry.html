let lang = localStorage.getItem("pbLang") || "en";
let selectedCode = localStorage.getItem("pbSelectedCountry") || DATA.countries[0].code;
let selected = DATA.countries.find(c=>c.code===selectedCode) || DATA.countries[0];

function L(o){ return o?.[lang] || o?.en || ""; }
function U(k){ return DATA.ui?.[lang]?.[k] || DATA.ui?.en?.[k] || k; }
function pbFlag(code, large=false){
  const iso=String(code||"").toLowerCase();
  if(!/^[a-z]{2}$/.test(iso)) return "";
  return `<img class="${large?"pb-flag-lg":"pb-flag"}" src="https://flagcdn.com/w80/${iso}.png" alt="" loading="lazy">`;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function saveCountry(code){
  const found=DATA.countries.find(c=>c.code===code);
  if(!found)return;
  selected=found; selectedCode=found.code;
  localStorage.setItem("pbSelectedCountry",selected.code);
  document.dispatchEvent(new CustomEvent("countrychange",{detail:selected}));
}
function countryUrl(code){return `country.html?country=${encodeURIComponent(code)}`;}
function entryUrl(code){return `market-entry.html?country=${encodeURIComponent(code)}`;}
function advisorUrl(code){return `advisor.html?country=${encodeURIComponent(code)}`;}
function setLanguage(value){
  lang=value; localStorage.setItem("pbLang",lang);
  document.documentElement.lang=lang;
  document.dispatchEvent(new Event("languagechange"));
}
function initCountryFromUrl(){
  const code=new URLSearchParams(location.search).get("country");
  if(code) saveCountry(code);
}
function setupGlobal(){
  initCountryFromUrl();
  const select=document.getElementById("languageSelect");
  if(select){select.value=lang;select.addEventListener("change",e=>setLanguage(e.target.value));}
  document.querySelectorAll("[data-country-link]").forEach(a=>a.addEventListener("click",()=>saveCountry(a.dataset.countryLink)));
}

setupGlobal();
function renderEntry(){
 const c=selected; document.title=`Pocket Biz · Market Entry · ${L(c.name)}`;
 document.getElementById("entryHeader").innerHTML=`<div class="kicker">MARKET ENTRY WORKSPACE</div><h1 style="font-size:64px">${pbFlag(c.code,true)}${esc(L(c.name))}</h1><p class="sub">A practical workspace for preparing a market entry decision.</p>`;
 const risk=Math.min(99,Math.round(c.difficulty*5 + (10-c.opportunity)*3 + 25));
 document.getElementById("tools").innerHTML=`
  <div class="card"><div class="tool-kicker">SCREENING</div><h3>Country Risk</h3><div class="score">${risk}/100</div><div class="meter"><span style="width:${risk}%"></span></div><p>Screening indicator based on Pocket Biz's difficulty and opportunity data. It is not legal, financial or investment advice.</p><div class="tool-row"><span>Difficulty</span><b>${c.difficulty}/10</b></div><div class="tool-row"><span>Opportunity</span><b>${c.opportunity}/10</b></div></div>
  <div class="card"><div class="tool-kicker">CURRENT RESEARCH</div><h3>Top Mistakes</h3><p>Research current, country-specific mistakes using web-grounded sources.</p><button class="btn gold" id="research" type="button">Research ${esc(L(c.name))}</button><div id="researchStatus" class="status">Ready.</div></div>
  <div class="card"><div class="tool-kicker">TRANSPARENT PLANNER</div><h3>Market Entry Budget</h3><p>Enter your own verified or quoted costs. Pocket Biz never invents a market-entry fee.</p><div id="costLines" class="cost-list"></div><button class="btn secondary" id="addCost" type="button" style="margin-top:10px">+ Add cost</button><div class="tool-result"><div class="kicker">YOUR TOTAL</div><div id="total" class="cost-total">€0</div></div></div>`;
 renderCosts();
 document.getElementById("research").onclick=researchMistakes;
 document.getElementById("timeline").innerHTML=[
  ["01","Validate",`Define the target customer, problem, competitors and evidence that ${esc(L(c.name))} is worth entering.`],
  ["02","Prepare",`Verify structure, taxes, licensing, pricing, localization and required professional support for ${esc(L(c.name))}.`],
  ["03","Test","Talk to real customers or partners and validate demand before committing major capital."],
  ["04","Enter","Launch in a controlled way, measure results and scale only after evidence."]
 ].map(x=>`<div class="card"><span class="step-no">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("");
 const key="pbChecklist_"+c.code; let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
 const items=[`Define your target customer in ${L(c.name)}.`,`Research at least 3 local competitors.`,`Verify company, tax and licensing requirements.`,`Build a local pricing and cost model.`,`Identify qualified local legal/accounting support.`,`Prepare localized sales materials.`,`Validate demand with real prospects.`,`Document the first 30-day launch plan.`];
 document.getElementById("checklist").innerHTML=`<div class="card"><h3>Before you enter ${esc(L(c.name))}</h3>${items.map((x,i)=>`<label class="check-item"><input type="checkbox" data-i="${i}" ${saved[i]?"checked":""}><span>${esc(x)}</span></label>`).join("")}</div><div class="card"><span class="verified-badge"><span class="check">✓</span> Verified Provider</span><h3>Professional support</h3><p>Use qualified legal, accounting, translation or market-entry professionals where the decision requires specialist knowledge.</p><a class="btn gold" href="providers.html">View providers</a></div>`;
 document.querySelectorAll("[data-i]").forEach(el=>el.addEventListener("change",()=>{saved[el.dataset.i]=el.checked;localStorage.setItem(key,JSON.stringify(saved));}));
}
function renderCosts(){
 const box=document.getElementById("costLines"), savedKey="pbCosts_"+selected.code; let rows=[];
 try{rows=JSON.parse(localStorage.getItem(savedKey)||"[]")}catch(e){}
 if(!rows.length)rows=[{label:"Company registration / setup",value:""},{label:"Legal / compliance",value:""},{label:"Accounting / tax setup",value:""}];
 function draw(){
  box.innerHTML=rows.map((r,i)=>`<div class="cost-line"><input class="input cost-label" data-i="${i}" value="${esc(r.label)}" placeholder="Cost description"><input class="input cost-value" data-i="${i}" inputmode="decimal" value="${esc(r.value)}" placeholder="€0"></div>`).join("");
  box.querySelectorAll("input").forEach(el=>el.addEventListener("input",()=>{rows[el.dataset.i][el.classList.contains("cost-label")?"label":"value"]=el.value;localStorage.setItem(savedKey,JSON.stringify(rows));updateTotal();}));
  updateTotal();
 }
 function updateTotal(){const total=rows.reduce((n,r)=>n+(parseFloat(String(r.value).replace(",","."))||0),0);document.getElementById("total").textContent="€"+total.toLocaleString(undefined,{maximumFractionDigits:2});}
 document.getElementById("addCost").onclick=()=>{rows.push({label:"",value:""});draw();};
 draw();
}
async function researchMistakes(){
 const btn=document.getElementById("research"),status=document.getElementById("researchStatus");
 btn.disabled=true;btn.textContent="Researching…";status.textContent="Searching current sources for "+L(selected.name)+"…";
 try{
  const r=await fetch("/api/mistakes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({country:selected.code,countryName:L(selected.name),language:lang})});
  const d=await r.json();if(!r.ok||!Array.isArray(d.mistakes))throw new Error(d.error||"Research failed");
  document.getElementById("mistakes").innerHTML=`<h2 class="section-title">Top mistakes in ${esc(L(selected.name))}</h2><div class="grid3">${d.mistakes.map((m,i)=>`<div class="card"><span class="verified-badge"><span class="check">✓</span> Web researched</span><h3>${i+1}. ${esc(m.title)}</h3><p>${esc(m.explanation)}</p>${m.sourceUrl?`<a class="source" href="${esc(m.sourceUrl)}" target="_blank" rel="noopener">${esc(m.sourceTitle||"Supporting source")} ↗</a>`:""}</div>`).join("")}</div>`;
  status.textContent="Research updated.";
 }catch(e){console.error(e);status.textContent="Research unavailable: "+e.message;}finally{btn.disabled=false;btn.textContent="Research "+L(selected.name);}
}
renderEntry();document.addEventListener("languagechange",renderEntry);
</script></body></html>
