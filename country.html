<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Biz · Country profile</title>
<meta name="description" content="Country-specific business culture, etiquette, law basics and market opportunity.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="container">
<nav class="nav">
  <a class="brand" href="index.html"><span class="brand-mark">PB</span><span>Pocket Biz</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navLinks">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="markets.html">Markets</a>
    <a href="compare.html">Compare</a>
    <a href="market-entry.html">Market Entry</a>
    <a href="advisor.html">Advisor</a>
    <a href="providers.html">Providers</a>
    <select id="languageSelect" class="lang-toggle" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="el">Ελληνικά</option>
    </select>
  </div>
</nav>
<main id="main">
<section class="section" id="country"></section>
</main>
<footer class="footer"><span>Pocket Biz</span><span>Country Profile · v23</span></footer>
</div>
<script src="assets/data.js"></script>
<script>
setupGlobal();
function riskClass(v){ return v >= 7 ? "high" : v >= 4 ? "med" : ""; }
function renderCountry(){
  const c = selected;
  document.title = `Pocket Biz · ${L(c.name)}`;
  document.getElementById("country").innerHTML = `
    <div class="actions">
      <a class="btn secondary" href="markets.html">← Markets</a>
      <a class="btn gold" href="${entryUrl(c.code)}">Plan market entry →</a>
      <a class="btn" href="${advisorUrl(c.code)}">Ask Advisor →</a>
    </div>
    <div class="profile-hero" style="margin-top:22px">
      <div class="card">
        <div class="kicker">${esc(L(c.region))} · ${c.code}</div>
        <h1 class="profile-title">${pbFlag(c.code,true)}${esc(L(c.name))}</h1>
        <p>${esc(L(c.summary))}</p>
        <div class="chips">${c.tags[lang].map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>
      <div class="card">
        <div class="kicker">Market snapshot</div>
        <div class="tool-row"><span>Culture difficulty</span><b>${c.difficulty}/10</b></div>
        <div class="meter risk"><span class="${riskClass(c.difficulty)}" style="width:${c.difficulty*10}%"></span></div>
        <div class="tool-row"><span>Opportunity</span><b>${c.opportunity}/10</b></div>
        <div class="meter"><span style="width:${c.opportunity*10}%"></span></div>
        <div class="tool-row"><span>Contacts</span><b>${c.contacts}</b></div>
      </div>
    </div>
    <div class="grid2" style="margin-top:18px">
      <div class="card"><h3>Communication</h3><p>${esc(L(c.culture))}</p></div>
      <div class="card"><h3>Etiquette</h3><p>${esc(L(c.etiquette))}</p></div>
      <div class="card"><h3>Law basics</h3><p>${esc(L(c.laws))}</p></div>
      <div class="card"><h3>Market</h3><p>${esc(L(c.market))}</p></div>
    </div>
    <div class="do-dont" style="margin-top:18px">
      <div class="good"><h3>Do</h3><ul>${c.dos[lang].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="bad"><h3>Don't</h3><ul>${c.donts[lang].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>`;
}
renderCountry();
document.addEventListener("languagechange", renderCountry);
</script>
</body>
</html>
